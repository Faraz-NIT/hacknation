# Render blueprint for the SkyMentor API (FastAPI + SQLite).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked
# sync: false are prompted for on first deploy. The free plan's disk is
# ephemeral: the SQLite DB resets on every deploy or restart.
services:
  - type: web
    name: skymentor-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: AVIATIONSTACK_KEY
        sync: false
      # Comma-separated; set to your Vercel URL once you have it, e.g.
      # https://skymentor.vercel.app
      - key: CORS_ORIGINS
        sync: false
